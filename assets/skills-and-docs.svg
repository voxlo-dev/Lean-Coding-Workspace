    <text x="189" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">idea → tickets</text>

    <rect x="272" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="341" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">/open-sprint</text>
    <text x="341" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">pulls the scope</text>

    <rect x="424" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="493" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">spec-design</text>
    <text x="493" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">reads the sprint file</text>

    <rect x="576" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="645" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">dynamic-workflow</text>
    <text x="645" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">code + tests</text>

    <rect x="728" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="797" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">e2e</text>
    <text x="797" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">optional</text>

    <rect x="880" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="949" y="66" text-anchor="middle" font-size="10.5" font-weight="600" fill="#312e81">maintain-docs</text>
    <text x="949" y="82" text-anchor="middle" font-size="10.5" font-weight="600" fill="#312e81">maintain-memory</text>

    <rect x="1032" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="1101" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">/close-sprint</text>
    <text x="1101" y="84" text-anchor="middle" font-size="9.5" fill="#4f46e5">distils + dissolves</text>
  </g>

  <!-- living -->
  <rect x="120" y="130" width="138" height="56" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="189" y="149" text-anchor="middle" font-size="9.5" fill="#065f46">backlog/T-NNN-*.md</text>
  <text x="189" y="163" text-anchor="middle" font-size="9.5" fill="#065f46">backlog/backlog.md</text>
  <text x="189" y="177" text-anchor="middle" font-size="9" fill="#059669">Draft · Backlog</text>

  <rect x="1032" y="130" width="138" height="56" rx="6" fill="#ffffff" stroke="#10b981"/>
  <text x="1101" y="153" text-anchor="middle" font-size="9.5" fill="#065f46">unfinished tickets</text>
  <text x="1101" y="169" text-anchor="middle" font-size="9.5" fill="#065f46">→ backlog/backlog.md</text>

  <path d="M200,188 C200,214 250,220 272,244" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <text x="252" y="212" font-size="9" fill="#64748b">pull</text>
  <path d="M1101,230 V192" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <text x="1026" y="214" text-anchor="end" font-size="9" fill="#64748b">carry over</text>

  <!-- the sprint file + board -->
  <rect x="272" y="232" width="898" height="46" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="284" y="248" font-size="9.5" fill="#7c2d12">artefacts/{sprint}/sprint.md — plan + kanban board</text>
  <text x="400" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">open</text>
  <text x="560" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">active</text>
  <text x="720" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">to test</text>
  <text x="880" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">done</text>
  <text x="1101" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c2410c">frozen</text>
  <text x="480" y="270" text-anchor="middle" font-size="10" fill="#f59e0b">→</text>
  <text x="640" y="270" text-anchor="middle" font-size="10" fill="#f59e0b">→</text>
  <text x="800" y="270" text-anchor="middle" font-size="10" fill="#f59e0b">→</text>
  <text x="1000" y="270" text-anchor="middle" font-size="10" fill="#f59e0b">→</text>

  <!-- run artefacts -->
  <rect x="424" y="292" width="138" height="52" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="493" y="313" text-anchor="middle" font-size="9.5" fill="#7c2d12">spec_{feature}.md</text>
  <text x="493" y="329" text-anchor="middle" font-size="9.5" fill="#7c2d12">e2e_*.md (cases)</text>

  <rect x="576" y="292" width="138" height="52" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="645" y="313" text-anchor="middle" font-size="9.5" fill="#7c2d12">impl-report_*.md</text>
  <text x="645" y="329" text-anchor="middle" font-size="9.5" fill="#7c2d12">handover_*.md</text>

  <rect x="728" y="292" width="138" height="52" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="797" y="313" text-anchor="middle" font-size="9.5" fill="#7c2d12">e2e-run_*.md</text>
  <text x="797" y="329" text-anchor="middle" font-size="9.5" fill="#7c2d12">e2e-report_*.md</text>

  <rect x="880" y="292" width="138" height="52" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="949" y="313" text-anchor="middle" font-size="9.5" fill="#7c2d12">sprint-decisions.md</text>
  <text x="949" y="329" text-anchor="middle" font-size="9" fill="#d97706">why it was decided</text>

  <path d="M1000,346 C1040,360 1060,364 1088,378" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#a2)"/>
  <text x="1022" y="370" font-size="9" fill="#64748b">indexed</text>

  <!-- durable -->
  <rect x="272" y="382" width="138" height="52" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="341" y="404" text-anchor="middle" font-size="9.5" fill="#1e3a8a">AGENTS.md</text>
  <text x="341" y="420" text-anchor="middle" font-size="9" fill="#2563eb">Current sprint</text>

  <rect x="880" y="382" width="138" height="92" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="949" y="404" text-anchor="middle" font-size="9.5" fill="#1e3a8a">behaviour.md</text>
  <text x="949" y="420" text-anchor="middle" font-size="9.5" fill="#1e3a8a">architecture.md</text>
  <text x="949" y="436" text-anchor="middle" font-size="9.5" fill="#1e3a8a">dev.md</text>
  <text x="949" y="452" text-anchor="middle" font-size="9.5" fill="#1e3a8a">product/ · ASSETS.md</text>

  <rect x="1032" y="382" width="138" height="92" rx="6" fill="#ffffff" stroke="#3b82f6"/>
  <text x="1101" y="404" text-anchor="middle" font-size="9.5" fill="#1e3a8a">decisions.md</text>
  <text x="1101" y="422" text-anchor="middle" font-size="9" fill="#2563eb">one line each,</text>
  <text x="1101" y="434" text-anchor="middle" font-size="9" fill="#2563eb">linking the sprint</text>
  <text x="1101" y="455" text-anchor="middle" font-size="9.5" fill="#1e3a8a">release.md</text>
  <text x="1101" y="468" text-anchor="middle" font-size="9" fill="#2563eb">runbook for /release</text>

  <!-- memory -->
  <rect x="880" y="512" width="138" height="44" rx="6" fill="#ffffff" stroke="#a855f7"/>
  <text x="949" y="530" text-anchor="middle" font-size="9.5" fill="#581c87">memory/MEMORY.md</text>
  <text x="949" y="545" text-anchor="middle" font-size="9" fill="#9333ea">project · domain · global</text>

  <text x="120" y="596" font-size="9.5" fill="#64748b">/project-initialiser scaffolds every doc above once, before any of this — /workspace-install sets up the workspace itself.</text>
  <text x="120" y="614" font-size="9.5" fill="#64748b">A ticket stays editable for its whole life; it travels left to right, its status token is where it sits, and /close-sprint dissolves it once its truth has graduated.</text>
</svg>
