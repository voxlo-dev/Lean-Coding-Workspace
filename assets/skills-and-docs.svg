<svg viewBox="0 0 1190 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1190" height="640" rx="12" fill="#fbfbfd"/>
  <text x="16" y="26" font-size="10.5" fill="#64748b">Read each column top-down: the skill on top writes the files beneath it.</text>

  <!-- lifespan bands -->
  <rect x="112" y="112" width="1062" height="92" rx="10" fill="#ecfdf5"/>
  <rect x="112" y="218" width="1062" height="136" rx="10" fill="#fff7ed"/>
  <rect x="112" y="368" width="1062" height="120" rx="10" fill="#eff6ff"/>
  <rect x="112" y="502" width="1062" height="64" rx="10" fill="#fdf4ff"/>

  <text x="102" y="152" text-anchor="end" font-size="10" font-weight="700" fill="#065f46">LIVING</text>
  <text x="102" y="166" text-anchor="end" font-size="9.5" fill="#059669">open work</text>
  <text x="102" y="279" text-anchor="end" font-size="10" font-weight="700" fill="#7c2d12">EPHEMERAL</text>
  <text x="102" y="293" text-anchor="end" font-size="9.5" fill="#c2410c">process history</text>
  <text x="102" y="421" text-anchor="end" font-size="10" font-weight="700" fill="#1e3a8a">DURABLE</text>
  <text x="102" y="435" text-anchor="end" font-size="9.5" fill="#2563eb">versioned truth</text>
  <text x="102" y="538" text-anchor="end" font-size="10" font-weight="700" fill="#581c87">MEMORY</text>

  <!-- skills row -->
  <g>
    <rect x="120" y="44" width="138" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
