<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 714" width="1120" height="714" role="img" aria-labelledby="title desc">
<title id="title">Where everything lives</title>
<desc id="desc">A ticket's journey: an idea becomes a ticket (Draft, then Backlog), is pulled onto the sprint board (open, active, to test, done), and at sprint close its outcome moves into the docs and the ticket file is deleted; unfinished tickets go back to the backlog. Four places hold everything: open work in backlog/, the sprint folder in artefacts/ (editable while the sprint runs, frozen when it closes), the lasting docs in docs/, and memory at project, domain and global level.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.bg{fill:#f6f8fa}
.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}
.t{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.m{fill:#59636e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
text.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.b{font-weight:600}
.arrow{stroke:#8c959f;stroke-width:1.6;fill:none}
.dash{stroke-dasharray:5 4}
.ahead{fill:#8c959f}
.blue{fill:#0969da}
.blue-box{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.blue-soft{fill:#ddf4ff}
.blue-stroke{stroke:#0969da;stroke-width:1.6;fill:none}
.blue-head{fill:#0969da}
