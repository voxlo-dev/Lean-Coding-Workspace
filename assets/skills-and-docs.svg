.amber-soft{fill:#fff8c5}
.amber-stroke{stroke:#9a6700;stroke-width:1.6;fill:none}
.amber-head{fill:#9a6700}
.green{fill:#1a7f37}
.green-box{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.green-soft{fill:#dafbe1}
.green-stroke{stroke:#1a7f37;stroke-width:1.6;fill:none}
.green-head{fill:#1a7f37}
.purple{fill:#8250df}
.purple-box{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
.purple-soft{fill:#fbefff}
.purple-stroke{stroke:#8250df;stroke-width:1.6;fill:none}
.purple-head{fill:#8250df}
.red{fill:#cf222e}
.red-box{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.red-soft{fill:#ffebe9}
.red-stroke{stroke:#cf222e;stroke-width:1.6;fill:none}
.red-head{fill:#cf222e}
.thick{stroke-width:2.4}
</style>
