<svg viewBox="0 0 1000 350" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- orchestrator -->
  <rect x="16" y="24" width="968" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Orchestrator</text>
  <text x="500" y="74" text-anchor="middle" font-size="13" fill="#b45309">plant · startet immer nur einen Agent · prüft jedes Ergebnis</text>

  <g stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <path d="M84,88 V188"/>
    <path d="M254,88 V188"/>
    <path d="M414,88 V188"/>
    <path d="M586,88 V188"/>
    <path d="M756,88 V188"/>
    <path d="M916,88 V188"/>
  </g>

  <!-- per-unit loop -->
  <rect x="172" y="142" width="496" height="186" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="184" y="321" font-size="13" font-weight="600" fill="#64748b">je Einheit</text>

  <!-- agents -->
  <g font-size="16" font-weight="600" text-anchor="middle" fill="#312e81">
    <rect x="16" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="84" y="224">Scaffold</text>
    <rect x="186" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="254" y="224">Spec-Architect</text>
    <rect x="346" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="414" y="224">Test-Autor</text>
    <rect x="518" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="586" y="224">Implementer</text>
    <rect x="688" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="756" y="224">E2E</text>
    <rect x="848" y="190" width="136" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="916" y="224">Docs</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#4f46e5">
    <text x="84" y="246">Projekt anlegen</text>
    <text x="254" y="246">Stubs + Spec</text>
    <text x="414" y="246">rote Tests</text>
    <text x="586" y="246">Coden bis grün</text>
    <text x="756" y="246">echter Nutzerablauf</text>
    <text x="916" y="246">Doku aktualisieren</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arw)">
    <path d="M152,228 H184"/>
    <path d="M322,228 H344"/>
    <path d="M482,228 H516"/>
    <path d="M654,228 H686"/>
    <path d="M824,228 H846"/>
  </g>

  <!-- visibility wall -->
  <path d="M500,168 V290" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="500" y="163" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ef4444">Trennwand</text>

  <!-- next unit -->
  <path d="M586,266 V304 H458 M342,304 H254 V268" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="400" y="309" text-anchor="middle" font-size="12.5" fill="#64748b">nächste Einheit</text>
</svg>
