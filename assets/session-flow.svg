<svg viewBox="0 0 980 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- setup -->
  <rect x="24" y="180" width="150" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="99" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#312e81">/project-init</text>
  <text x="99" y="225" text-anchor="middle" font-size="10" fill="#4f46e5">once per repo</text>

  <path d="M174,212 H208" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw)"/>

  <rect x="214" y="180" width="140" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="284" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#312e81">/open-sprint</text>
  <text x="284" y="225" text-anchor="middle" font-size="10" fill="#4f46e5">branch + fresh board</text>

  <path d="M354,212 H386" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw)"/>

  <!-- the run -->
  <rect x="392" y="96" width="340" height="280" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="412" y="121" font-size="11" font-weight="600" fill="#64748b">one run — many runs per sprint</text>

  <rect x="412" y="136" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="163" text-anchor="middle" font-size="11" fill="#334155">spec-design — spec + test strategy</text>
  <path d="M562,180 V192" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="412" y="196" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="223" text-anchor="middle" font-size="11" fill="#334155">implement — code + tests</text>
  <path d="M562,240 V252" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="412" y="256" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="283" text-anchor="middle" font-size="11" fill="#334155">e2e — validate (optional)</text>
  <path d="M562,300 V312" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="412" y="316" width="300" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="343" text-anchor="middle" font-size="11" fill="#334155">docs · memory · commit / PR</text>

  <path d="M732,212 H770" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arw)"/>

  <!-- close -->
  <rect x="776" y="180" width="180" height="64" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="866" y="206" text-anchor="middle" font-size="11.5" font-weight="600" fill="#312e81">/close-sprint</text>
  <text x="866" y="225" text-anchor="middle" font-size="10" fill="#4f46e5">review · distil · merge</text>

  <!-- release (optional, spans several sprints) -->
  <path d="M888,244 V282" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <rect x="820" y="288" width="136" height="58" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-dasharray="5 4"/>
  <text x="888" y="311" text-anchor="middle" font-size="11.5" font-weight="600" fill="#312e81">/release</text>
  <text x="888" y="330" text-anchor="middle" font-size="9.5" fill="#4f46e5">once N sprints make</text>
  <text x="888" y="342" text-anchor="middle" font-size="9.5" fill="#4f46e5">a version</text>

  <!-- loop back -->
  <path d="M800,244 V404 Q800,416 788,416 H670 M480,416 H296 Q284,416 284,404 V250"
        stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="575" y="418" text-anchor="middle" font-size="10" fill="#64748b">sprint done → next sprint</text>
</svg>
