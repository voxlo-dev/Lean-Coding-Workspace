# Merged into a repo's .codex/config.toml by project-initialiser (Codex loads it only in a
# trusted project). Registers the domain's skills folder and its MCP servers, project-scoped.

[[skills.config]]
path = ".codex/skills/{x}-domain/skills"
enabled = true

